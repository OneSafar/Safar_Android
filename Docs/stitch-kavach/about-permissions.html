<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>About Kavach</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#0A56D9",
            "background-light": "#FFFFFF",
            "background-dark": "#101722",
            "surface": "#F0F4F9",
            "text-main": "#1C1B1F",
            "text-muted": "#44474E",
            "success-bg": "#E8F5E9",
            "success-text": "#146C2E",
          },
          fontFamily: {
            "display": ["Plus Jakarta Sans", "sans-serif"],
            "body": ["DM Sans", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "2xl": "24px",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    body {
      font-family: 'DM Sans', sans-serif;
      background-color: #FFFFFF;
      color: #1C1B1F;
    }
    h1, h2, h3, h4, h5, h6, .font-display {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen bg-background-light text-text-main antialiased selection:bg-primary/20">
<!-- Mobile Container -->
<main class="max-w-md mx-auto min-h-screen flex flex-col relative overflow-hidden bg-background-light shadow-2xl">
<!-- Minimal Header with Back Button (Exception for Onboarding/Setup) -->
<header class="flex items-center p-4 pt-8 shrink-0">
<button aria-label="Go back" class="p-2 rounded-full hover:bg-surface transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 text-text-main">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
</header>
<!-- Scrollable Content Area -->
<div class="flex-1 overflow-y-auto px-6 pb-12 flex flex-col items-center">
<!-- Hero Icon -->
<div class="mt-2 mb-6 flex justify-center items-center w-[72px] h-[72px] rounded-full bg-primary/10">
<span class="material-symbols-outlined text-[40px] text-primary" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<!-- Header & Description -->
<h1 class="font-display font-bold text-[28px] leading-tight text-text-main text-center mb-4">About Kavach</h1>
<p class="font-body text-base text-text-muted text-center mb-8 max-w-[300px]">
        Kavach acts as a shield, blocking only the apps you choose during your focus sessions.
      </p>
<!-- Privacy Card -->
<div class="w-full bg-surface rounded-2xl p-4 mb-8 flex items-start gap-3">
<span class="material-symbols-outlined text-primary mt-0.5 shrink-0" style="font-variation-settings: 'FILL' 1;">lock</span>
<p class="font-body text-sm font-medium text-text-muted leading-snug">
          We do not read your messages, passwords, photos, or any personal content.
        </p>
</div>
<!-- Permissions Section -->
<div class="w-full mt-2">
<h2 class="font-display font-semibold text-lg text-text-main mb-4 text-left">Permissions are your choice</h2>
<div class="flex flex-col gap-4">
<!-- Permission Row 1 (Required State) -->
<div class="flex items-center justify-between py-2">
<span class="font-body text-base font-medium text-text-main">App Usage Permission</span>
<button class="font-display font-semibold text-sm bg-primary text-white px-4 py-2 rounded-full min-w-[100px] hover:bg-primary/90 transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
              REQUIRED
            </button>
</div>
<!-- Divider -->
<div class="h-px w-full bg-surface"></div>
<!-- Permission Row 2 (Granted State Example) -->
<div class="flex items-center justify-between py-2">
<span class="font-body text-base font-medium text-text-main">Ekagra Mode Accessibility</span>
<div class="font-display font-semibold text-sm bg-success-bg text-success-text px-4 py-2 rounded-full min-w-[100px] flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[16px] leading-none" style="font-variation-settings: 'FILL' 1;">check_circle</span>
              GRANTED
            </div>
</div>
</div>
</div>
</div>
</main>
</body></html>
