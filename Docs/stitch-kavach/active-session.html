<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kavach - Active Session</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0a57db",
                        "background-light": "#f5f6f8",
                        "background-dark": "#101722",
                        "surface-light": "#e3eaf5",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"],
                        "body": ["DM Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-primary text-white font-body antialiased selection:bg-white selection:text-primary">
<div class="relative flex flex-col min-h-[884px] w-full max-w-md mx-auto overflow-hidden px-6 pt-12 pb-10">
<!-- Header / Back Navigation (Back-to-Main Exception) -->
<header class="flex items-center justify-start w-full mb-auto">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10 transition-colors focus:outline-none focus:ring-2 focus:ring-white/50">
<span class="material-symbols-outlined text-white text-2xl" data-icon="arrow_back">arrow_back</span>
</button>
</header>
<!-- Main Content (Centered) -->
<main class="flex-1 flex flex-col items-center justify-center w-full">
<!-- Shield Icon Visual Indicator -->
<div class="mb-8 w-24 h-24 rounded-full bg-white/10 flex items-center justify-center backdrop-blur-sm border border-white/20">
<span class="material-symbols-outlined text-white text-[56px]" data-icon="shield" style="font-variation-settings: 'FILL' 1;">shield</span>
</div>
<!-- Timer Display -->
<div class="font-display font-bold text-[72px] leading-none tracking-tight mb-4 text-center select-tabular-nums">
                45:00
            </div>
<!-- Status Indicator -->
<div class="flex items-center justify-center gap-2 bg-white/10 rounded-full px-4 py-2 backdrop-blur-sm border border-white/10">
<div class="w-2 h-2 rounded-full bg-[#146C2E] animate-pulse"></div>
<p class="font-medium text-surface-light text-base text-center">
                    Kavach is active. 14 distractions blocked.
                </p>
</div>
</main>
<!-- Bottom Action (Bailout) -->
<div class="w-full mt-auto pt-8">
<button class="w-full h-14 flex items-center justify-center rounded-full border-2 border-white/30 text-white font-display font-semibold text-base tracking-wide hover:bg-white hover:text-primary transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-white/20">
                End Session
            </button>
</div>
</div>
</body></html>
